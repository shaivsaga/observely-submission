# Compose and activity-compose are AndroidX; AGP refuses to build without this.
android.useAndroidX=true
# Bound concurrency to avoid native-memory exhaustion after the C2 compiler's malloc failure during lint.
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx512m -Xms128m -XX:MaxMetaspaceSize=384m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
